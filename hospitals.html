<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Hospital Finder | MedTrack</title>

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">✚</span>
        Med<span>Track</span>
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a
            href="hospitals.html"
            class="active"
        >
            Hospitals
        </a>

        <a href="emergency.html">
            Emergency
        </a>

        <a href="ambulance.html">
            Ambulance
        </a>

        <a href="blood.html">
            Blood
        </a>

    </nav>

</header>


<main class="hospital-page">


<section class="page-title">

    <div>

        <span class="section-label">
            INTELLIGENT HOSPITAL DISCOVERY
        </span>

        <h1>
            Find the right hospital
        </h1>

        <p>
            Search by location, specialty and live availability.
        </p>

    </div>


    <button
        onclick="getUserLocation()"
        class="primary-btn"
    >
        📍 Use My Location
    </button>

</section>


<!-- SMART QUERY -->

<section class="smart-query">

    <div class="query-icon">
        🤖
    </div>

    <div class="query-content">

        <strong>
            Smart hospital recommendation
        </strong>

        <p>
            Tell us what you need and we'll rank suitable hospitals.
        </p>

    </div>


    <select id="requirementFilter">

        <option value="all">
            Any Requirement
        </option>

        <option value="ICU">
            ICU
        </option>

        <option value="Emergency">
            Emergency Care
        </option>

        <option value="Ambulance">
            Ambulance
        </option>

        <option value="Cardiology">
            Cardiology
        </option>

        <option value="Neurology">
            Neurology
        </option>

        <option value="Blood">
            Blood Bank
        </option>

    </select>


    <button
        class="primary-btn"
        onclick="smartRecommend()"
    >
        Find Best Match
    </button>

</section>


<!-- SEARCH -->

<div class="search-panel">

    <input
        type="text"
        id="hospitalSearch"
        placeholder="Search hospital, specialty or location..."
        oninput="filterHospitals()"
    >


    <select
        id="availabilityFilter"
        onchange="filterHospitals()"
    >

        <option value="all">
            All Hospitals
        </option>

        <option value="emergency">
            Emergency Available
        </option>

        <option value="icu">
            ICU Available
        </option>

        <option value="ambulance">
            Ambulance Available
        </option>

    </select>


    <select
        id="sortFilter"
        onchange="filterHospitals()"
    >

        <option value="score">
            Smart Ranking
        </option>

        <option value="distance">
            Nearest
        </option>

        <option value="beds">
            Most Beds
        </option>

        <option value="icu">
            Most ICU Beds
        </option>

    </select>

</div>


<!-- MAP + RESULTS -->

<div class="hospital-layout">

    <div class="map-section">

        <div id="hospitalMap"></div>

    </div>


    <div
        class="hospital-list"
        id="hospitalList"
    >

    </div>

</div>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/hospitals.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>

</body>

</html>
